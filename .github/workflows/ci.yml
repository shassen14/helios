name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Bevy needs these to build on Linux (audio, input devices, windowing), and
# its renderer needs a GPU even headless: Mesa's software Vulkan stands in on
# a runner that has none.
env:
  BEVY_LINUX_DEPS: >-
    g++ pkg-config libx11-dev libasound2-dev libudev-dev
    libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev mesa-vulkan-drivers

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_LINUX_DEPS
      - run: cargo clippy --workspace --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_LINUX_DEPS
      - run: cargo install cargo-nextest --locked
      - run: cargo nextest run --workspace --all-features

  doctest:
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_LINUX_DEPS
      - run: cargo test --doc --workspace --all-features

  # Every committed run file through the headless sim, each report compared
  # with this platform's golden file under configs/test/golden/<platform>/.
  # Each platform rounds floats its own way, so each keeps its own golden
  # files, and the job runs on every one.
  golden:
    name: Golden runs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_LINUX_DEPS
      - run: cargo test -p helios_test --features sim --test golden_runs -- --ignored
      # What this runner produced, in golden form: replacing
      # configs/test/golden/<platform>/ with the folder inside blesses it.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: target/tmp/golden_runs/golden
          retention-days: 7
