# helios_core/Cargo.toml

[package]
name = "helios_core"
# These fields are inherited from the [workspace.package] section
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# These dependencies use the versions defined in the root Cargo.toml
nalgebra = { workspace = true, features = ["serde-serialize"] }
num-traits = "0.2.19"
serde = { workspace = true }
dyn-clone = "1.0"
rand = { workspace = true }
rand_distr = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
codspeed-criterion-compat = "2"
serde_json = "1"

[[bench]]
name = "estimation"
harness = false

[[bench]]
name = "planning"
harness = false

[[bench]]
name = "mapping"
harness = false
