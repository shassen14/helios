kind = "AStar"
rate = 5.0
arrival_tolerance_m = 1.5
occupancy_threshold = 180
max_search_depth = 20000
enable_path_smoothing = true
replan_on_path_deviation = true
deviation_tolerance_m = 3.0
level = "local"
# Channel the planner reads its goal from; the host writes the mission goal to
# the same name. Planner and host input agree by this string. Omit to default
# to "mission".
goal_channel = "mission"
