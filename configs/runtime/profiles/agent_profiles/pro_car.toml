# =========================================================================
# == Agent Profile: Pro Car ==
# =========================================================================
# Portable autonomy configuration. No vehicle, sensors, or physics.
# Root-level keys are the fields of AutonomyStack.
# Safe to load in helios_hw without helios_sim.

# ekf_advanced is the estimator whose aiding covariances match the ins_pro
# sensor suite this profile is flown with.
[estimators.primary]
from = "runtime.catalog.estimators.ekf_advanced"

[search_planners]
local_path = { from = "runtime.catalog.planners.a_star" }

[path_following]
kind = "PurePursuit"
max_speed_m_s = 5.0
min_speed_m_s = 0.5
lookahead_distance_m = 4.0
goal_radius = 3.0
max_lateral_acceleration = 3.0
state_source = "ground_truth"

[controllers]
path_follower = { from = "runtime.catalog.controllers.direct_twist" }

[teleop]
kind = "Twist"
surge = 5.0    # matches path_following.max_speed_m_s, so teleop tops out where autonomy does
yaw = 1.0      # rad/s at full stick

[command_arbitration]
sources = ["teleop", "autonomy"]
teleop_max_age_s = 0.5

# Converts the controller's BodyTwist command into the per-actuator terminal
# (drive velocity + steer angle) that the host applies. `drive`/`steer` name  the
# actuators declared in the vehicle's [actuation] contract.
[allocators.wheels]
kind = "KinematicAckermann"
wheelbase = 2.5
wheel_radius = 0.3
drive = "drive"
steer = "steer"
