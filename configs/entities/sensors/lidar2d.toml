# A planar (single-ring) lidar: one ring at 0° elevation, full-circle sweep.
kind = "Lidar"                                # <-- Matches SensorDeviceConfig::Lidar
rate = 10.0
range_min = 0.15                              # Blind zone: nearer returns are misses
max_range = 50.0
azimuth_fov = 360.0                           # Full-circle spinning scanner
azimuth_beams = 360
ring_elevations = [0.0]                       # Single ring in the sensor's horizontal plane
range_noise_stddev = 0.03
angular_noise_stddev = 0.1
