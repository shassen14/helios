# Base Ackermann vehicle body. The vouched `pro_car` (00_tutorial_showcase)
# inherits this via `sim.catalog.agents.ackermann_car_pro`.

# Single rigid body plus (future) named mount frames — the general single-body
# topology, shared by any non-articulated agent. Mass is the only field the L0
# path consumes today; mount frames and inertia arrive with the raycast plant.
[topology]
kind = "RigidBodyWithMount"
mass = 1500.0            # kg

# L0 arcade shim: open-loop feedforward wrench gains (drive velocity -> forward
# force, steer angle -> yaw torque) plus the passive damping that stands in for a
# real resistive force. Not a controller, so steady-state speed only approximates
# the command; the whole shim is retired when the raycast plant supplies real
# forces.
[plant]
kind = "L0Shim"
l0_force_gain = 1200.0
l0_yaw_gain = 16400.0
linear_damping = 1.0     # cuts passive coast distance when braking
angular_damping = 1.5    # gentle yaw decay; prevents spin-out without killing turns

# Physics collider and contact material. Full side lengths in the Bevy body frame
# (x = width, y = height, z = length); this is construction-space, not ENU. The
# collider is distinct from the visual mesh and from any future perception mesh.
[collision]
kind = "Cuboid"
x = 1.8
y = 0.8
z = 4.0
friction = 0.7

[[actuation.actuators]]
id = "drive"
kind = "Velocity"
limit = 66.7                    # rad/s wheel speed (≈ 20 m/s at r = 0.3)
safe_state = { Velocity = 0.0 }
sign = "Normal"

[[actuation.actuators]]
id = "steer"
kind = "Position"
limit = 0.61                    # rad (≈ 35°)
safe_state = { Position = 0.0 }
sign = "Normal"
