# Base Ackermann vehicle body. The vouched `pro_car` (00_tutorial_showcase)
# inherits this via `sim.catalog.agents.ackermann_car_pro`.

kind = "Ackermann"
wheelbase = 2.5
max_steering_angle = 35.0  # degrees
max_steering_rate  = 140.0 # degrees/sec

# Rigid-body physics applied to the Avian3D RigidBody.
# max_force must exceed static friction: mass * 9.81 * friction ≈ 10,300 N for defaults.
[physics]
mass             = 1500.0  # kg
friction         = 0.7
linear_damping   = 1.0   # cuts passive coast distance when braking
angular_damping  = 1.5   # gentle yaw decay; prevents spin-out without killing turns

# Actuator saturation limits. Physical force/torque maximums, not gains.
[actuator]
max_force  = 22000.0  # N
max_torque = 10000.0  # N·m
max_speed  = 20.0     # m/s

# Output adapter: closed-loop speed + yaw-rate PIDs pairing with a BodyVelocity controller.
[adapter]
kind = "DualSisoPid"

[adapter.longitudinal]   # gains in N / (m/s)
kp             = 8000.0
ki             = 100.0
kd             = 200.0
integral_clamp = 30.0

[adapter.lateral]        # gains in N·m / (rad/s)
kp             = 8000.0
ki             = 1.0
kd             = 0.0
integral_clamp = 0.5
