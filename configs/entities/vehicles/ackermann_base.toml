# Base Ackermann vehicle body. The vouched `pro_car` (00_tutorial_showcase)
# inherits this via `sim.catalog.agents.ackermann_car_pro`.

kind = "Ackermann"
wheelbase = 2.5
wheel_radius = 0.3

# Rigid-body physics applied to the Avian3D RigidBody.
[physics]
mass = 1500.0         # kg
friction = 0.7
linear_damping = 1.0  # cuts passive coast distance when braking
angular_damping = 1.5 # gentle yaw decay; prevents spin-out without killing turns

# L0 arcade-shim wrench gains: open-loop feedforward that scales a resolved
# setpoint into a chassis wrench (drive velocity -> forward force, steer angle ->
# yaw torque). Not a controller, so steady-state speed only approximates the
# command; retired when L1 dynamic actuation lands. See
# docs/4_action/ackermann_actuation.md.
[actuator]
l0_force_gain = 1200.0
l0_yaw_gain = 16400.0


[[actuation.actuators]]
id = "drive"
kind = "Velocity"
limit = 66.7                    # rad/s wheel speed (≈ 20 m/s at r = 0.3)
safe_state = { Velocity = 0.0 }
sign = "Normal"

[[actuation.actuators]]
id = "steer"
kind = "Position"
limit = 0.61                    # rad (≈ 35°)
safe_state = { Position = 0.0 }
sign = "Normal"
