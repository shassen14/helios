# An input that names no instance, on a keyed channel that declares exactly
# one, resolves to that one.
#
# The estimate is bound to `tf` with no instance; the channel declares only
# `agent.ProvingCar.base_link`, so the report lists the estimate under that
# instance, as if it were named. A second declared instance would make this
# selector ambiguous and refused at setup, never a silent change of frame.

schema_version = "2.0"
scenario = { from = "sim/scenarios/01_proving_ground.toml" }
observation = { from = "default" }
termination = { max_simulated_seconds = 2.0 }

[[evaluate]]
name = "est"
kind = "pose_error"
[evaluate.inputs]
estimate = "agent.ProvingCar.channel.tf"
truth = { path = "agent.ProvingCar.channel.truth.tf", instance = "agent.ProvingCar.base_link" }
[evaluate.params]
align = "first_pose"
