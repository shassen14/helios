# Negative control: a run aborted at setup still reports each evaluation it
# bound.
#
# `est` binds: the EKF's estimate against the car's truth, as
# pose_error_proving_ground grades it. `wrong` reads the `estimate` channel,
# which carries a `FrameAwareState`, where its role reads a
# `StampedTransform`, so setup refuses it and the run is aborted (exit 3).
# The report lists both: `est` as `underived`, with what it was bound to
# and no count, and `wrong` as `unusable`, naming both types. A report
# listing `wrong` alone would read as a run that asked for one evaluation.

schema_version = "2.0"
scenario = { from = "sim/scenarios/01_proving_ground.toml" }
observation = { from = "default" }
termination = { max_simulated_seconds = 2.0 }

[evaluation]
gap_multiple = 3.0

[[evaluate]]
name = "est"
kind = "pose_error"
[evaluate.inputs]
estimate = { path = "agent.ProvingCar.channel.tf", instance = "agent.ProvingCar.base_link" }
truth = { path = "agent.ProvingCar.channel.truth.tf", instance = "agent.ProvingCar.base_link" }
[evaluate.params]
align = "declared"

[[evaluate]]
name = "wrong"
kind = "pose_error"
[evaluate.inputs]
estimate = "agent.ProvingCar.channel.estimate"
truth = { path = "agent.ProvingCar.channel.truth.tf", instance = "agent.ProvingCar.base_link" }
[evaluate.params]
align = "first_pose"
