# Negative control: a parameter the kind doesn't take.
#
# `align` is `pose_error`'s parameter; `twist_tracking` compares twists in
# the body frame and takes none. The run is refused before the sim starts
# (exit 2):
#   twist_tracking: unknown field `align`, there are no fields
# A pass would mean a misspelled or misplaced parameter is ignored, and the
# run judged under settings its author didn't get.

schema_version = "2.0"
scenario = { from = "sim/scenarios/01_proving_ground.toml" }
observation = { from = "default" }
termination = { max_simulated_seconds = 2.0 }

[evaluation]
gap_multiple = 3.0

[[evaluate]]
name = "twist"
kind = "twist_tracking"
[evaluate.inputs]
truth = { path = "agent.ProvingCar.channel.truth.twist", instance = "agent.ProvingCar.base_link" }
reference = "agent.ProvingCar.channel.reference"
[evaluate.params]
align = "first_pose"
