# Negative control: `declared` alignment between roots nothing relates.
#
# The estimate is rooted in the agent's odom and the truth in the world.
# Both writers declare their roots, so setup refuses the evaluation and the
# run fails (exit 1), naming both:
#   the estimate's root 'agent.ProvingCar.odom' and the truth's root
#   'global.proving_ground' are different frames
# A pass would mean two unrelated frames were compared as if they were one.

schema_version = "2.0"
scenario = { from = "sim/scenarios/01_proving_ground.toml" }
observation = { from = "default" }
termination = { max_simulated_seconds = 60.0 }

[[evaluate]]
name = "est"
kind = "pose_error"
[evaluate.inputs]
estimate = { path = "agent.ProvingCar.channel.tf", instance = "agent.ProvingCar.base_link" }
truth = { path = "agent.ProvingCar.channel.truth.tf", instance = "agent.ProvingCar.base_link" }
[evaluate.params]
align = "declared"

[[assert]]
name = "position_held"
target = "eval.inline.est.position"
window = { start = 5.0 }
condition = { less_than = 1.0 }

[[measure]]
name = "position_rms"
target = "eval.inline.est.position"
reduce = "rms"

[[measure]]
name = "position_max"
target = "eval.inline.est.position"
reduce = "max"

[[measure]]
name = "position_final"
target = "eval.inline.est.position"
reduce = "final"

[[measure]]
name = "z_rms"
target = "eval.inline.est.z"
reduce = "rms"

[[measure]]
name = "rotation_rms"
target = "eval.inline.est.rotation"
reduce = "rms"

[[measure]]
name = "rotation_max"
target = "eval.inline.est.rotation"
reduce = "max"
