# Negative control: an input bound to a channel of the wrong payload type.
#
# The estimate role reads a `StampedTransform`; the `estimate` channel
# carries a `FrameAwareState`. Setup refuses the evaluation and the run
# fails (exit 1), naming both types:
#   it carries ...FrameAwareState, and the role reads ...StampedTransform
# A pass would mean a payload was read as a type it isn't.

schema_version = "2.0"
scenario = { from = "sim/scenarios/01_proving_ground.toml" }
observation = { from = "default" }
termination = { max_simulated_seconds = 2.0 }

[[evaluate]]
name = "est"
kind = "pose_error"
[evaluate.inputs]
estimate = "agent.ProvingCar.channel.estimate"
truth = { path = "agent.ProvingCar.channel.truth.tf", instance = "agent.ProvingCar.base_link" }
[evaluate.params]
align = "first_pose"
