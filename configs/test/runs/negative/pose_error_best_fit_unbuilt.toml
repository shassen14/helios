# Negative control: an alignment that is named but not built.
#
# `align = "best_fit"` is part of `pose_error`'s vocabulary and has no
# implementation yet, so the run is refused before the sim starts (exit 2):
#   pose_error: align = "best_fit" is not built yet
# A pass would mean an unbuilt policy is being accepted, and some other
# alignment silently used in its place.

schema_version = "2.0"
scenario = { from = "sim/scenarios/01_proving_ground.toml" }
observation = { from = "default" }
termination = { max_simulated_seconds = 2.0 }

[[evaluate]]
name = "est"
kind = "pose_error"
[evaluate.inputs]
estimate = { path = "agent.ProvingCar.channel.tf", instance = "agent.ProvingCar.base_link" }
truth = { path = "agent.ProvingCar.channel.truth.tf", instance = "agent.ProvingCar.base_link" }
[evaluate.params]
align = "best_fit"
