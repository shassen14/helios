# Proving ground run with the estimator built as a RecursiveEstimator node.
#
# Same world, car, seed and budget as proving_ground.toml; only the estimator
# is declared differently. The node runs the legacy loop on the legacy clock,
# so the car must come to rest at exactly the proving-ground run's
# final_pos_e / final_pos_n. Any difference is a bug in how the node is
# assembled from its components.

schema_version = "1.0"

# Resolved relative to --config-root (default "configs").
scenario = { from = "test/scenarios/proving_ground_recursive.toml" }

# Carried but unused (observation presets aren't resolved yet).
observation = { from = "default" }

termination = { max_simulated_seconds = 60.0 }
