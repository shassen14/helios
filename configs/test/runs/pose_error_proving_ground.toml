# Pose error of the proving-ground car's GPS-fused EKF, graded under
# `declared`: the build anchors the EKF's odom at the world's datum, since its
# GPS aiding pins odom's position there, and each estimate is placed in the
# datum through that anchor, never aligned from a sample.
#
# The estimate starts at the odom origin with a wide prior; the first GPS
# update moves it to the car's start, (-20, 0, 1). Those first samples really
# are 20 m off, so the assertion and the measures start a settle time after
# the first GPS update the filter applied (its `aiding.gps.nis` emission),
# which is when the estimate can first be expected in place. The GPS channel
# itself can't anchor the window: its payload has no extractor.
#
# `position_held`'s bound is a regression pin set from this run's measured
# error, not a specification of the EKF.

schema_version = "2.0"
scenario = { from = "sim/scenarios/01_proving_ground.toml" }
observation = { from = "default" }
termination = { max_simulated_seconds = 60.0 }

[evaluation]
gap_multiple = 3.0

[[evaluate]]
name = "est"
kind = "pose_error"
[evaluate.inputs]
estimate = { path = "agent.ProvingCar.channel.tf", instance = "agent.ProvingCar.base_link" }
truth = { path = "agent.ProvingCar.channel.truth.tf", instance = "agent.ProvingCar.base_link" }
[evaluate.params]
align = "declared"

[[assert]]
name = "position_held"
target = "eval.inline.est.position"
window = { start = { after = "agent.ProvingCar.node.primary.aiding.gps.nis", plus = 5.0 } }
condition = { less_than = 0.15 }

[[measure]]
name = "position_rms"
target = "eval.inline.est.position"
reduce = "rms"
window = { start = { after = "agent.ProvingCar.node.primary.aiding.gps.nis", plus = 5.0 } }

[[measure]]
name = "position_max"
target = "eval.inline.est.position"
reduce = "max"
window = { start = { after = "agent.ProvingCar.node.primary.aiding.gps.nis", plus = 5.0 } }

[[measure]]
name = "position_final"
target = "eval.inline.est.position"
reduce = "final"
window = { start = { after = "agent.ProvingCar.node.primary.aiding.gps.nis", plus = 5.0 } }

[[measure]]
name = "z_rms"
target = "eval.inline.est.z"
reduce = "rms"
window = { start = { after = "agent.ProvingCar.node.primary.aiding.gps.nis", plus = 5.0 } }

[[measure]]
name = "rotation_rms"
target = "eval.inline.est.rotation"
reduce = "rms"
window = { start = { after = "agent.ProvingCar.node.primary.aiding.gps.nis", plus = 5.0 } }

[[measure]]
name = "rotation_max"
target = "eval.inline.est.rotation"
reduce = "max"
window = { start = { after = "agent.ProvingCar.node.primary.aiding.gps.nis", plus = 5.0 } }
