# Pose error of the proving-ground car's GPS-fused EKF, aligned on its first
# pose. This run FAILS today, and its failure is the finding it pins.
#
# The estimate starts at the odom origin; within 0.05 s the first GPS update
# moves it to the car's start, (-20, 0, 1). `first_pose` aligns on the
# estimate before that fix, so a 20 m offset sits in every later sample and
# `position_held` fails at about 20 m. `first_pose` is the right policy for an
# estimator that starts where its body is, not for one pulled in by GPS; this
# one is graded by `declared` once odom is anchored to the GPS datum.
#
# When that lands, this run changes on purpose: its golden report is updated
# in the same commit, and the change is visible in review.

schema_version = "2.0"
scenario = { from = "sim/scenarios/01_proving_ground.toml" }
observation = { from = "default" }
termination = { max_simulated_seconds = 60.0 }

[[evaluate]]
name = "est"
kind = "pose_error"
[evaluate.inputs]
estimate = { path = "agent.ProvingCar.channel.tf", instance = "agent.ProvingCar.base_link" }
truth = { path = "agent.ProvingCar.channel.truth.tf", instance = "agent.ProvingCar.base_link" }
[evaluate.params]
align = "first_pose"

[[assert]]
name = "position_held"
target = "eval.inline.est.position"
window = { start = 5.0 }
condition = { less_than = 1.0 }

[[measure]]
name = "position_rms"
target = "eval.inline.est.position"
reduce = "rms"

[[measure]]
name = "position_max"
target = "eval.inline.est.position"
reduce = "max"

[[measure]]
name = "position_final"
target = "eval.inline.est.position"
reduce = "final"

[[measure]]
name = "z_rms"
target = "eval.inline.est.z"
reduce = "rms"

[[measure]]
name = "rotation_rms"
target = "eval.inline.est.rotation"
reduce = "rms"

[[measure]]
name = "rotation_max"
target = "eval.inline.est.rotation"
reduce = "max"
