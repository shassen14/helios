schema_version = "3.0"
run_name = "aborted_lists_bound_evaluations"
scenario = "sim/scenarios/01_proving_ground.toml"
status = "aborted"
simulated_duration_secs = 0.0
assertions = []

[terminated_by]
kind = "aborted"

[[terminated_by.causes]]
kind = "unusable_entries"

[[evaluations]]
name = "est"
kind = "pose_error"
status = "underived"

[evaluations.params]
align = "declared"

[evaluations.binding]
roots = "agent.ProvingCar.odom anchored at global.proving_ground"

[[evaluations.inputs]]
role = "estimate"
instance = "agent.ProvingCar.base_link"
writer = "node estimate_relay"

[evaluations.inputs.target]
path = "agent.ProvingCar.channel.tf"
instance = "agent.ProvingCar.base_link"

[evaluations.inputs.cap]
multiple = 3.0
seconds = 0.0075

[[evaluations.inputs]]
role = "truth"
instance = "agent.ProvingCar.base_link"
writer = "body unit truth_rig"
provenance = "exact"

[evaluations.inputs.target]
path = "agent.ProvingCar.channel.truth.tf"
instance = "agent.ProvingCar.base_link"

[evaluations.inputs.cap]
multiple = 3.0
seconds = 0.0075

[[evaluations.metrics]]
path = "eval.inline.est.position"
