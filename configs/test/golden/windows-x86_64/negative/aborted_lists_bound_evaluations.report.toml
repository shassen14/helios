[[evaluations.metrics]]
path = "eval.inline.est.horizontal"
unit = "m"

[[evaluations.metrics]]
path = "eval.inline.est.vertical"
unit = "m"

[[evaluations.metrics]]
path = "eval.inline.est.x"
unit = "m"

[[evaluations.metrics]]
path = "eval.inline.est.y"
unit = "m"

[[evaluations.metrics]]
path = "eval.inline.est.z"
unit = "m"

[[evaluations.metrics]]
path = "eval.inline.est.along"
unit = "m"

[[evaluations.metrics]]
path = "eval.inline.est.cross"
