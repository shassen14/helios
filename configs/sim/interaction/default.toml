# Interaction feel — sparse overrides for camera and selection tuning.
# Every value below is optional; anything omitted falls back to the compiled-in
# default (shown in the comment). Angles and angular rates are authored in
# DEGREES and converted to radians on load. Uncomment only what you want to change.

# [camera.keyboard]
# orbit_rate_deg = 57.3    # yaw sweep while an orbit key is held (default ≈ 57.3°/s = 1.0 rad/s)
# pitch_rate_deg = 57.3   # pitch speed while a pitch key is held (default ≈ 57.3°/s = 1.0 rad/s)
# zoom_rate      = 25.0   # orbit-distance change, m/s (default 25.0)

# [camera.mouse]
# orbit_sensitivity_deg = 0.29   # yaw/pitch per pixel of drag (default ≈ 0.29°/px = 0.005 rad/px)
# pan_sensitivity       = 0.05   # ground meters per pixel of drag (default 0.05)
# zoom_per_line         = 2.0    # zoom per wheel notch (default 2.0)
# zoom_per_pixel        = 0.05   # zoom per pixel of trackpad scroll (default 0.05)
# zoom_per_pinch        = 40.0   # zoom per unit pinch (default 40.0)

# [camera.rig]
# pitch_eps_deg = 2.9    # margin held below vertical (default ≈ 2.9° = 0.05 rad)
# min_distance  = 2.0    # closest orbit distance, m (default 2.0)
# max_distance  = 500.0  # farthest orbit distance, m (default 500.0)

# [selection]
# highlight_color  = [1.0, 0.85, 0.2]  # ring color, linear sRGB (default amber)
# highlight_radius = 1.5               # ring radius when no bounding box, m (default 1.5)
# highlight_margin = 1.15              # ring width vs footprint, unitless >= 1 (default 1.15)
