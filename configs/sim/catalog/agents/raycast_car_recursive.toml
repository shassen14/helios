# =========================================================================
# == Agent Prefab: Raycast Car, Recursive Estimator ==
# =========================================================================
# raycast_car flown with the raycast_car_recursive profile, whose estimator is
# a RecursiveEstimator node; body, sensors and poses are a copy. Delete it
# together with that profile.

name = "RaycastCarRecursive"
starting_pose = { translation = [0.0, 0.5, 1.0], rotation = [0.0, 0.0, 0.0] }
goal_pose     = { translation = [0.0, 0.5, 0.0] }

# --- Hardware Configuration ---
vehicle        = { from = "entities.vehicles.raycast_car" }
# --- Software (Autonomy) Configuration ---
autonomy_stack = { from = "runtime.profiles.agent_profiles.raycast_car_recursive" }

# The ins_pro INS suite (IMU + GPS + magnetometer) plus a lidar that feeds the
# occupancy grid the profile's A* planner reads. This table stays last: every
# top-level key must precede it, or it would parse as a sensor entry.
[sensors]
from = "runtime.catalog.sensor_suites.ins_pro"

[sensors.lidar]
from = "entities.sensors.lidar2d"

# A 3D lidar for viewing only, as on raycast_car.
[sensors.rear_lidar]
from = "entities.sensors.lidar3d_16"
