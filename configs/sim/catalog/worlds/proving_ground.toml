# configs/sim/catalog/worlds/proving_ground.toml
# A flat walled test area: the smallest world that exercises every part of
# the object pipeline. Each group below is there to test something.
#
# The obstacles stand on the route on purpose. This world exposes what the
# autonomy stack gets wrong, so known weaknesses show up here, in sim, before
# field testing. Don't move an obstacle off the route to make a run look
# clean.
#
# Positions are ENU metres (x east, y north, z up) of each object's origin,
# which every asset keeps on its base: z = 0 stands it on the ground.
# Orientation is [roll, pitch, yaw] in degrees; yaw 90 turns an object's
# forward (+X) from east to north.
name = "proving_ground"

# --- Ground: an ordinary placed object, top face at z = 0 ---------------

[[objects]]
name     = "ground"
prefab   = "entities.objects.ground_100m"
position = [0.0, 0.0, 0.0]

# --- Perimeter: one 4 m wall stretched 15x along its length (60 m) -------
# Tests scaled colliders; all four share one hull per (prefab, scale).

[[objects]]
name     = "north_wall"
prefab   = "entities.objects.wall_4m"
position = [0.0, 30.0, 0.0]
scale    = [15.0, 1.0, 1.0]

[[objects]]
name     = "south_wall"
prefab   = "entities.objects.wall_4m"
position = [0.0, -30.0, 0.0]
scale    = [15.0, 1.0, 1.0]

[[objects]]
name                = "east_wall"
prefab              = "entities.objects.wall_4m"
position            = [30.0, 0.0, 0.0]
orientation_degrees = [0.0, 0.0, 90.0]
scale               = [15.0, 1.0, 1.0]

[[objects]]
name                = "west_wall"
prefab              = "entities.objects.wall_4m"
position            = [-30.0, 0.0, 0.0]
orientation_degrees = [0.0, 0.0, 90.0]
scale               = [15.0, 1.0, 1.0]

# --- Barrier: a 12 m wall across the route, spanning y = -4..8 ----------
# Seen by the lidar and mapped, so the planner must route around it. The
# south end is the shorter way round, and the corner the car's body must
# clear: a planner that plans for a point, with no width or heading, clips
# it.

[[objects]]
name                = "barrier"
prefab              = "entities.objects.wall_4m"
position            = [0.0, 2.0, 0.0]
orientation_degrees = [0.0, 0.0, 90.0]
scale               = [3.0, 1.0, 1.0]

# --- Crates: pushable, one stacked on another ----------------------------

[[objects]]
name     = "crate_a"
prefab   = "entities.objects.crate_1m"
position = [8.0, 10.0, 0.0]
body     = "dynamic"

[[objects]]
name     = "crate_b"
prefab   = "entities.objects.crate_1m"
position = [9.5, 10.0, 0.0]
body     = "dynamic"

[[objects]]
name     = "crate_a_top"
prefab   = "entities.objects.crate_1m"
position = [8.0, 10.0, 1.0]
body     = "dynamic"

# A low fixed platform: a crate squashed to 3 x 1 x 0.5 m.
[[objects]]
name     = "platform"
prefab   = "entities.objects.crate_1m"
position = [-8.0, -10.0, 0.0]
scale    = [3.0, 1.0, 0.5]

# --- Cones: convex-hull colliders, a pushable row and one fixed ----------
# The row stands across the route at x = 12. At 0.7 m the cones sit below
# the planar lidar's scan plane, so a mapper fed only by it never sees them
# and the car drives into them. They are dynamic so the car pushes through
# instead of stalling.

[[objects]]
name     = "cone_0"
prefab   = "entities.objects.traffic_cone"
position = [12.0, -1.5, 0.0]
body     = "dynamic"

[[objects]]
name     = "cone_1"
prefab   = "entities.objects.traffic_cone"
position = [12.0, -0.5, 0.0]
body     = "dynamic"

[[objects]]
name     = "cone_2"
prefab   = "entities.objects.traffic_cone"
position = [12.0, 0.5, 0.0]
body     = "dynamic"

[[objects]]
name     = "cone_3"
prefab   = "entities.objects.traffic_cone"
position = [12.0, 1.5, 0.0]
body     = "dynamic"

[[objects]]
name     = "cone_fixed"
prefab   = "entities.objects.traffic_cone"
position = [15.0, 15.0, 0.0]
