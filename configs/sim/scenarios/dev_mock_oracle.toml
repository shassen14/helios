# =========================================================================
# == Dev Scenario: Mock Oracle Estimator ==
# =========================================================================
# E2E acceptance for Phase 3's mock_oracle_estimator: the proving-ground
# scenario with only the estimator replaced by the MockOracle passthrough.
# Everything else (A*, occupancy grid, controller, lidar) is the same real
# pipeline, all from the raycast_car prefab.
#
# What to verify when running this:
#   1. DAG dump at startup lists `mock_oracle_estimator` (not `ekf`).
#   2. F10 oracle-pose gizmo lights up — consumer-side declaration of
#      oracle/pose is what allocates the bus slot the publisher writes to.
#   3. `\` bus dump shows `oracle/pose`, `oracle/twist`, and
#      `FrameAwareState @ ""` all `[set]`.
#   4. Vehicle tracks the planned path; with the mock estimator there is
#      no estimation error.

[simulation]
duration_seconds = 60.0
seed = 1337

[world.layout]
from = "sim.catalog.worlds.proving_ground"

[world.semantic_classes]
from = "runtime.catalog.semantic_classes.default"

[world.atmosphere]
gravity_enu = [0.0, 0.0, -9.81]  # [east, north, up] m/s²
sun_elevation = 45.0
sun_azimuth = 180.0
ambient_lux = 1500.0

[[agents]]
from = "sim.catalog.agents.raycast_car"
name = "MockOraclePro"
# Inside the proving ground's walls, along the route its own scenario drives.
starting_pose = { translation = [-20.0, 0.0, 1.0], rotation = [0.0, 0.0, 0.0] }
goal_pose = { translation = [20.0, 0.0, 0.5] }

# === The only real Phase 3 change: swap the estimator for MockOracle. ===
# Deep-merge override of the estimator field inherited from raycast_car.
# Because MockOracle's config is empty, no further keys are needed.
[agents.autonomy_stack.estimators.primary]
from = "runtime.catalog.estimators.mock_oracle"
