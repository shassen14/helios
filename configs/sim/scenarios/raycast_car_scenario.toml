# =========================================================================
# == Helios Simulation: Raycast Car Scenario ==
# =========================================================================
# Brings up the L1 raycast car on the same terrain the vouched tutorial uses.
# The world MUST supply a ground collider under the wheels: unlike the L0 arcade
# car (which needs no world query), each raycast wheel casts a downward ray and
# finds nothing over empty space, so the car falls through.

[simulation]
duration_seconds = 180.0
seed = 2024

# starter_world2 gives the drivable ground surface the wheel rays strike.
[[world.terrains]]
mesh = "maps/starter_world2.glb"
collider = "maps/starter_world2_col.glb"
medium = "air"

[world.atmosphere]
gravity_enu = [0.0, 0.0, -9.81]  # [east, north, up] m/s²
sun_elevation = 45.0
sun_azimuth = 180.0
ambient_lux = 1500.0

[[agents]]
from = "sim.catalog.agents.raycast_car"
name = "RaycastCar-Baseline"
# ENU world pose. `rotation` is [roll, pitch, yaw] in degrees.
# TUNING: the z here sets how far the wheels start above the terrain; it must
# leave each downward ray (length ≈ rest_length + wheel_radius + ray_margin
# below the mount) reaching the ground. Too high and the wheels spawn airborne;
# too low and the springs spawn slammed solid.
starting_pose = { translation = [-10.0, 10.0, 1.0], rotation = [0.0, 0.0, 0.0] }
goal_pose = { translation = [5.0, 5.0, 0.5] }
